<!DOCTYPE html>

<style>
:root{

  --bg:#F5F5F7; --card:#fff; --ink:#1d2433; --muted:#6b7280; --line:#e5e7eb; --soft:#fafafa;

}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy2)}
.hidden{display:none!important}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px;white-space:nowrap;font-size:16px}
.logo{background:var(--gold);color:var(--navy);border-radius:6px;padding:2px 7px;font-weight:800;font-size:14px}
.spacer{flex:1}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 11px;font-size:13px;text-decoration:none}
.tabs{display:flex;gap:2px;padding:0 12px;background:var(--navy);overflow-x:auto;position:sticky;top:52px;z-index:19}
.tab{background:transparent;border:0;color:#c9d3e3;padding:10px 14px;border-radius:10px 10px 0 0;font-weight:600;white-space:nowrap;font-size:14px}
.tab.on{background:var(--bg);color:var(--navy)}
.tab .n{background:var(--gold);color:var(--navy);border-radius:999px;padding:0 6px;font-size:11px;margin-left:5px;font-weight:800}
.demo-banner{background:#dbeafe;color:#1e3a8a;text-align:center;font-size:13px;padding:5px}
.page{max-width:1240px;margin:0 auto;padding:18px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;color:var(--navy);white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:#efc2bd}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.xs{padding:3px 8px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h3{margin:0 0 10px;color:var(--navy);font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);font-size:15px;min-width:0;width:100%}
textarea.inp,label.f textarea{resize:vertical;line-height:1.45}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:#eef1f6;color:var(--navy);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--infobg);color:var(--info)}.chip.gray{background:#f0f0f2;color:#555}.chip.gold{background:var(--gold2);color:#7a5200}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:14px}
.sectitle{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:4px 0 6px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login{width:100%;max-width:400px}
.login h1{margin:6px 0 2px;color:var(--navy);font-size:24px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.link{background:none;border:0;color:var(--navy2);text-decoration:underline;padding:0;font-size:13px;text-align:left}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;gap:12px;align-items:center;cursor:pointer}
.item:hover{border-color:#c7ccd6}
.item .ic{width:42px;height:42px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;background:#f1f3f7;line-height:1.05}
.item .ic b{font-size:16px;color:var(--navy)}.item .ic span{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .inp{width:auto;flex:1;min-width:180px}
.seg{display:inline-flex;background:#e9eaee;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-weight:600;font-size:13px;color:#444}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
/* meeting page */
.mtg{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.mhead2{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.mhead2 h1{margin:0;color:var(--navy);font-size:22px}
.sect{margin-bottom:16px}
.sect>.sh{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.sect>.sh h2{margin:0;font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--navy)}
.sect>.sh .line{flex:1;height:1px;background:var(--line)}
.ai{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.ai.grp{border-left:4px solid var(--gold)}
.ai .ttl{display:flex;gap:8px;align-items:flex-start}
.ai .ttl input.tin{font-weight:700;font-size:15px;border:1px solid transparent;border-radius:8px;padding:3px 6px;flex:1;min-width:0;background:transparent}
.ai .ttl input.tin:hover,.ai .ttl input.tin:focus{border-color:var(--line);background:#fff}
.ai .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px 6px}
.hist{font-size:13px;color:#384152;margin:4px 0 8px 6px;border-left:2px solid #e5e7eb;padding-left:10px}
.hist div{margin:2px 0}.hist b{color:var(--navy);font-size:11.5px;letter-spacing:.3px}
.mot{background:#f8f9fb;border:1px solid #eceef2;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}
.mot .mrow{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:6px;align-items:center}
.mot select,.mot input{border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:13px;background:#fff;min-width:0;width:100%}
.act{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:6px;background:#fffaf0;border:1px solid #f3e6cc;border-radius:10px;padding:6px 8px}
.act input,.act select{border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:13px;background:#fff;min-width:0}
.ups{margin:4px 0 0 6px;padding-left:18px;font-size:14px}
.ups li{margin:2px 0}
.depts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:110px}
.att{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:14px;align-items:center}
.att .pa{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.att .pa button{border:0;background:#fff;padding:3px 8px;font-size:12px;font-weight:700;color:#888}
.att .pa button.on.p{background:var(--okbg);color:var(--ok)}.att .pa button.on.a{background:var(--badbg);color:var(--bad)}
.doc{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid #f3f3f5}
.doc a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm{border:0;background:none;color:#b0b5bf;font-size:14px;padding:2px 6px}
.rm:hover{color:var(--bad)}
.notice{background:var(--warnbg);color:#6b4500;border-radius:12px;padding:10px 12px;font-size:13px}
.notice.info{background:var(--infobg);color:#1f3f86}
.notice.ok{background:var(--okbg);color:#14532d}
/* print-style document */
.docview{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 34px;max-width:860px;margin:0 auto;font-family:Georgia,"Times New Roman",serif;color:#111}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.pcard{cursor:pointer;transition:box-shadow .15s}.pcard:hover{box-shadow:0 4px 16px rgba(27,50,84,.12)}
.bar{height:7px;background:#eceef2;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok,#1a6e3c);border-radius:6px}.bar.over i{background:var(--bad)}
.box{border:1px solid #e7e3da;border-radius:12px;padding:10px 12px;background:#fcfbf8}
.ck{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid #f1efe9;font-size:14px}.ck>span{flex:1;min-width:0}.ck.done>span{text-decoration:line-through;opacity:.6}.ck input{margin-top:3px}
.logline{font-size:13px;padding:6px 0;border-bottom:1px solid #f1efe9}
.calrow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:#fff;border:1px solid #eee;margin-top:6px;cursor:pointer}.calrow .main{flex:1;min-width:0}
.calday{width:42px;text-align:center;flex-shrink:0;line-height:1.1}.calday span{display:block;font-size:11px;color:var(--muted,#667085);text-transform:uppercase}.calday b{font-size:19px;color:var(--navy)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:8px}
.ph{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#e9eaee}.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:12px;line-height:24px;padding:0}
.pcover{margin:-16px -16px 10px;height:130px;overflow:hidden;border-radius:12px 12px 0 0;background:#e9eaee}.pcover img{width:100%;height:100%;object-fit:cover;display:block}
.conf-on{background:#fde8e8!important;border-color:#f5b5b5!important}
@media(max-width:640px){
  input,select,textarea,.inp{font-size:16px!important}

  .pcover{margin:-12px -12px 10px}

@media print{.dlogo img{height:78px}}

.docview h2{font-family:-apple-system,"Segoe UI",Arial,sans-serif;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:3px;margin:22px 0 8px}
.docview h3{font-size:15px;margin:10px 0 3px;font-family:-apple-system,"Segoe UI",Arial,sans-serif}
.docview .dmeta{font-family:-apple-system,"Segoe UI",Arial,sans-serif;font-size:13px;color:#444}
.docview ul{margin:3px 0 6px 0;padding-left:22px}.docview li{margin:1px 0}
.docview .mline{font-family:-apple-system,"Segoe UI",Arial,sans-serif;font-size:13px;margin:4px 0 4px 22px;color:#222}
.docview .mline b{color:var(--navy)}
.docview .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
.docview .dgrid .dp h3{margin:6px 0 0}
.docview pre{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.5}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media(min-width:760px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:20px}}
.modal h2{margin:0;color:var(--navy);font-size:20px}
.mhead{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;margin-bottom:14px}
.x{border:0;background:#f1f1f3;border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1;flex:none}
.rcpt{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}
.rcpt label{display:flex;gap:7px;align-items:flex-start;font-size:13px;padding:4px}
table.tb{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.tb th{text-align:left;font-size:12px;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);background:#fafafa}
table.tb td{padding:8px;border-bottom:1px solid #f0f0f2;vertical-align:top}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:92vw}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
.pub{max-width:880px;margin:0 auto;padding:18px}
.pubhead{background:var(--navy);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}
.pubhead h1{margin:6px 0 2px;font-size:22px}
.saving{font-size:12px;opacity:.8}
@media(max-width:980px){.mtg{grid-template-columns:1fr}.side{position:static}}
@media(max-width:640px){.grid2,.grid3,.depts,.docview .dgrid{grid-template-columns:1fr}.page{padding:12px}.top{padding:8px 12px;gap:8px}.top .uname{display:none}.tabs{position:static}.mot .mrow{grid-template-columns:1fr 1fr}.docview{padding:18px}}
@media print{
  .top,.tabs,.demo-banner,.toolbar,.btn,#toast,.side,.noprint,.x{display:none!important}
  body{background:#fff}
  .page{padding:0;max-width:none}
  .docview{border:0;padding:0;max-width:none}
  .mtg{display:block}
  h2{break-after:avoid}.ai,.dp{break-inside:avoid}
}
</style>

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowIso = () => new Date().toISOString();
const clone = o => JSON.parse(JSON.stringify(o));
const lsGet = (k, d=null) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const dOf = iso => { const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const fmtD = (iso, o) => iso ? dOf(iso).toLocaleDateString([], o || {month:'long', day:'numeric', year:'numeric'}) : '';
const fmtDT = iso => iso ? new Date(iso).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
const monLabel = iso => iso ? dOf(iso).toLocaleDateString('en-US', {month:'short', year:'numeric'}).toUpperCase() : '';

const nowTime = () => new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
function toast(msg, kind='') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;

}
const body = id => S.bodies.find(b => b.id === id);

const mtg = id => S.meetings.find(m => m.id === id);

async function save(kind, row) {
  row.updated_at = nowIso(); if (!row.created_at) row.created_at = row.updated_at;
  const a = S[kind]; const i = a.findIndex(r => r.id === row.id); if (i >= 0) a[i] = row; else a.push(row);
  S.saving++; renderSaving();
  try { const saved = await B.upsert(kind, row); const j = a.findIndex(r => r.id === row.id); if (saved && j >= 0) a[j] = {...saved}; return saved || row; }
  catch (e) { console.error(e); toast('Could not save: ' + (e.message || e), 'bad'); throw e; }
  finally { S.saving--; renderSaving(); }
}
async function del(kind, id) {
  const a = S[kind]; const i = a.findIndex(r => r.id === id); if (i >= 0) a.splice(i, 1);
  try { await B.remove(kind, id); } catch (e) { toast('Could not delete: ' + (e.message || e), 'bad'); }
}
function renderSaving() { const el = $('#saving'); if (el) el.textContent = S.saving ? 'Saving…' : 'All changes saved'; }

}

/* ---------------- meeting logic ---------------- */
async function createMeeting(o) {
  const b = body(o.body_id);
  const m = {id: uid(), body_id: o.body_id, title: o.title || `${b.name} — ${monthName(o.date)}`, meeting_date: o.date, start_time: o.time || '', location: o.location || '',
    status: 'draft', attendance: {present: [], absent: []}, opening: b.kind === 'council' ? 'Pastor led prayer.' : '', links: [], published: false, confidential: b.kind === 'executive'};
  await save('meetings', m);
  const its = []; const mots = []; const placed = [];
  const add = (section, extra) => { const it = {id: uid(), meeting_id: m.id, section, sort: (its.filter(x => x.section === section).length + 1) * 10, updates: [], ...extra}; its.push(it); return it; };
  add('opening', {title: b.kind === 'council' ? 'Call to order & opening prayer' : 'Call to order'});
  const prev = prevMeeting(m);
  if (prev && prev.status !== 'approved' && prev.status !== 'cancelled') {
    const it = add('minutes', {title: `${monthName(prev.meeting_date)} meeting minutes`, body: 'Approval needed — view minutes attached.'});
    mots.push({id: uid(), meeting_id: m.id, item_id: it.id, sort: 0, text: `Approve the ${monthName(prev.meeting_date)} meeting minutes`, result: 'pending', approves_meeting_id: prev.id});
  }
  const ths = S.threads.filter(t => t.body_id === o.body_id && t.status === 'open').sort((a, c) => (a.sort || 0) - (c.sort || 0));
  ths.forEach(t => add('old', {title: t.title, thread_id: t.id}));
  if (b.kind === 'council') {
    add('financial', {title: 'Financial update'});
    S.departments.filter(d => d.active !== false).sort((a, c) => (a.sort || 0) - (c.sort || 0)).forEach(d => { const it = add('dept', {title: d.name, department_id: d.id, presenter: d.leader || ''}); waitingUpdates(d.id).forEach(u => { it.updates.push(...updLines(u)); placed.push({u, it}); }); });
  }
  if (o.inbox) for (const x of S.inbox.filter(x => x.status === 'pending' && (!x.body_id || x.body_id === o.body_id))) {
    const it = add(x.section === 'old' || x.section === 'financial' ? x.section : 'new', {title: x.title, body: x.summary || '', source: x.source, source_id: x.source_id, source_link: x.link});
    await save('inbox', {...clone(x), status: 'accepted', meeting_id: m.id, item_id: it.id});
  }
  const close = add('closing', {title: 'Adjourn'});
  mots.push({id: uid(), meeting_id: m.id, item_id: close.id, sort: 0, text: 'Adjourn', result: 'pending'});
  for (const it of its) await save('items', it);
  for (const mo of mots) await save('motions', mo);
  for (const {u, it} of placed) await save('updates', {...clone(u), meeting_id: m.id, item_id: it.id, updated_at: nowIso()});
  return m;
}
async function syncThreadLog(it) {
  const t = thr(it.thread_id); const m = mtg(it.meeting_id); if (!t || !m) return;
  const text = (it.minutes || '').trim();
  const log = (t.log || []).filter(e => e.meeting_id !== m.id);
  if (text) {
    const entry = {label: monLabel(m.meeting_date), text, meeting_id: m.id, ...(it.confidential ? {confidential: true} : {})};
    const at = log.findIndex(e => e.meeting_id && mtg(e.meeting_id) && String(mtg(e.meeting_id).meeting_date) > String(m.meeting_date));
    if (at >= 0) log.splice(at, 0, entry); else log.push(entry);
  }
  await save('threads', {...clone(t), log});
}
async function applyMotionEffects(mo, prevResult) {
  if (!mo.approves_meeting_id) return;
  const target = mtg(mo.approves_meeting_id); if (!target) return;
  const m = mtg(mo.meeting_id); const b = body(target.body_id) || {};
  if (mo.result === 'approved' && target.status !== 'approved') {
    await save('meetings', {...clone(target), status: 'approved', approved_at: nowIso(), approved_in: m.id, published: target.imported ? !!target.published : (b.public_minutes !== false && !target.confidential)});
    toast(`${monthName(target.meeting_date)} minutes marked approved`, 'ok');
  } else if (mo.result !== 'approved' && prevResult === 'approved' && target.approved_in === m.id) {
    await save('meetings', {...clone(target), status: 'minutes_draft', approved_at: null, approved_in: null});
  }
}

function nextMeetingDate(bid) {
  const last = meetingsOf(bid)[0]; const d = new Date(); d.setDate(d.getDate() + 1);
  if (bid === 'council') { // 2nd Sunday of next month after the last meeting
    const base = last ? dOf(last.meeting_date) : new Date(); const n = new Date(base.getFullYear(), base.getMonth() + 1, 1);
    while (n.getDay() !== 0) n.setDate(n.getDate() + 1); n.setDate(n.getDate() + 7); if (n < new Date()) return today(); return isoOf(n);
  }
  return isoOf(d);
}

/* ---------------- field binding: data-bind="kind:id:field" saves on change ---------------- */
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.upload !== undefined) {
    const files = [...el.files]; if (!files.length) return; const m = mtg(S.meetingId); const iid = el.dataset.upload || null;
    toast(`Uploading ${files.length} file${files.length === 1 ? '' : 's'}…`);
    for (const f of files) {
      if (f.size > 25 * 1024 * 1024) { toast(`${f.name} is over 25 MB`, 'bad'); continue; }
      try { const safe = f.name.replace(/[^\w.\- ]+/g, '_'); const up = await B.upload(f, `meetings/${m.id}/${uid().slice(0, 8)}-${safe}`);
        await save('docs', {id: uid(), meeting_id: m.id, item_id: iid, name: f.name, path: up.path, size: f.size, mime: f.type, public: false, uploaded_by: me()}); }
      catch (err) { toast('Upload failed: ' + (err.message || err), 'bad'); }
    }
    rerender(); return;
  }
  if (el.dataset.chg === 'nmBody') { S.modalBody = el.value; renderModal(); return; }
  if (el.dataset.chg === 'yearF') { S.yearF = el.value; renderApp(); return; }
  const bind = el.dataset.bind; if (!bind) return;
  const [kind, id, field] = bind.split(':'); const row = S[kind].find(r => r.id === id); if (!row) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (v === '__other') { const n = prompt('Name:'); if (!n) { rerender(); return; } v = n.trim(); }
  if (kind === 'motions' && field === 'vote' && v === '__count') {
    const c = prompt('Votes as yes / no / abstain — e.g. 7/1/0'); if (!c) { rerender(); return; } const [y, n, a] = c.split(/[\/, ]+/).map(x => parseInt(x, 10) || 0);

  }
  const next = clone(row); if (field.includes('.')) { const [a, b2] = field.split('.'); next[a] = {...(next[a] || {}), [b2]: v}; } else next[field] = typeof v === 'string' ? v.trim() : v;
  if (field === 'due_date' && !v) next[field] = null;
  const prevResult = row.result;
  await save(kind, next);
  if (kind === 'items' && field === 'minutes' && next.thread_id) await syncThreadLog(next);
  if (kind === 'motions' && field === 'result') { await applyMotionEffects(next, prevResult); rerender(); }
  if (kind === 'motions' && field === 'moved_by' && v && !mem(v) && el.value === '__other') rerender();
});

async function boot() {
  B = S.backend === 'local' ? Local : Remote;
  if (B === Remote) { try { Remote.init(); } catch (e) { $('#app').innerHTML = viewLogin('Could not connect to the database.'); return; } }
  renderApp(); await reload(); loadHubUsers(); B.subscribe(remoteChanged); checkEmail().then(() => { if (S.view === 'settings') renderApp(); });
  const deep = PARAMS.get('m'); if (deep && mtg(deep)) { history.replaceState(null, '', location.pathname); ACT.openMeeting({id: deep}); }
}
function signIn(session, fallbackUser) { S.backend = 'remote'; lsSet('board_backend', 'remote'); S.email = (session && session.email) || ''; S.hubAdmin = !!(session && session.isAdmin); S.user = session ? session.username : fallbackUser; S.userName = session ? (session.displayName || session.username) : fallbackUser; lsSet('board_user', S.user); }
function hubSession() { if (!window.DelcAuth) return null; try { const s = DelcAuth.getSession(); return s && DelcAuth.hasAppAccess(s, CONFIG.appKey) ? s : null; } catch (_) { return null; } }
async function start() {
  if (PARAMS.get('demo') === '1') lsSet('board_backend', 'local');
  const backend = lsGet('board_backend') || 'remote';
  if (PUBLIC) { S.backend = backend; B = backend === 'local' ? Local : Remote; if (B === Remote) { try { Remote.init(); } catch (e) {} } renderApp(); await reload(); return; }
  if (backend === 'local') { S.backend = 'local'; S.user = lsGet('board_user'); S.userName = S.user === 'demo' ? 'Demo' : S.user; if (S.user) boot(); else renderApp(); return; }
  let sess = hubSession();
  if (sess && DelcAuth.refreshSession) { try { await DelcAuth.refreshSession(); sess = hubSession(); } catch (_) {} }
  if (sess && window.supabase) { signIn(sess); boot(); return; }
  const s0 = window.DelcAuth && (() => { try { return DelcAuth.getSession(); } catch (_) { return null; } })();
  $('#app').innerHTML = viewLogin(s0 ? `You’re signed in to the hub as ${s0.username}, but your account doesn’t have access to delcBOARD. Ask an admin to turn it on, or sign in as someone else.` : '');
}


/* ================= Roles & department updates ================= */
var ROLES = {
  admin:    {name: 'Admin', short: 'Admin', desc: 'everything, plus reviews department updates and manages people & groups'},
  member:   {name: 'Council member', short: 'Council', desc: 'meetings, agendas, minutes and records; sends updates for any department they direct'},
  director: {name: 'Department director', short: 'Director', desc: 'only sees their own department page: sends updates and sees what was approved'}
};
var UPD = {pending: {name: 'Waiting for review', cls: 'warn'}, returned: {name: 'Sent back', cls: 'bad'}, approved: {name: 'Approved', cls: 'ok'}, declined: {name: 'Not used', cls: 'gray'}, draft: {name: 'Draft', cls: 'gray'}};

function myMember() {
  const u = String(S.user || '').toLowerCase(), e = String(S.email || '').toLowerCase();
  if (S.backend === 'local') return S.demoRole === 'director' ? mem('m-barb') || S.members[0] : mem('m-derek') || S.members[0];
  return S.members.find(m => m.active !== false && ((m.hub_username && m.hub_username.toLowerCase() === u) || (e && m.email && m.email.toLowerCase() === e))) || null;
}
function role() {
  if (S.backend === 'local') return S.demoRole || 'admin';
  if (!S.loaded) return 'member';
  const m = myMember(); if (m) return ROLES[m.role] ? m.role : 'member';
  // first-time setup: if nobody is an Admin yet, a hub admin can get in to set things up
  if (S.hubAdmin && !S.members.some(x => x.role === 'admin' && x.active !== false)) return 'admin';
  return 'none';
}
function isAdmin() { return role() === 'admin'; }
function myDepts() {
  const all = S.departments.filter(d => d.active !== false).sort((a, b) => (a.sort || 0) - (b.sort || 0));
  if (isAdmin()) return all;
  const me_ = myMember(); return me_ ? all.filter(d => (d.director_ids || []).includes(me_.id)) : [];
}
function canSendFor(d) { const me_ = myMember(); return isAdmin() || !!(me_ && (d.director_ids || []).includes(me_.id)); }
function deptBadge() {
  if (isAdmin()) return S.updates.filter(u => u.status === 'pending').length;
  const ids = new Set(myDepts().map(d => d.id)); return S.updates.filter(u => ids.has(u.department_id) && u.status === 'returned').length;
}
const updLines = u => lines(u.text).map(t => ({text: t.replace(/^[-•*]\s+/, ''), by: u.submitted_by || '', at: nowIso(), update_id: u.id}));
const waitingUpdates = did => S.updates.filter(u => u.department_id === did && u.status === 'approved' && !u.meeting_id);
const openCouncilMeetings = () => S.meetings.filter(m => m.body_id === 'council' && ['draft','ready','in_progress'].includes(m.status)).sort((a, b) => String(a.meeting_date).localeCompare(String(b.meeting_date)));
const updChip = s => `<span class="chip ${(UPD[s] || {}).cls || ''}">${esc((UPD[s] || {name: s}).name)}</span>`;
function meetingPick(id, sel) {
  const ms = openCouncilMeetings(); const v = sel === undefined ? (ms[0] ? ms[0].id : '') : (sel || '');
  return `<select id="${id}" class="inp">${ms.map(m => `<option value="${m.id}" ${m.id === v ? 'selected' : ''}>${esc(m.title)}</option>`).join('')}<option value="" ${!v ? 'selected' : ''}>Next council meeting (when it’s created)</option></select>`;
}

/* ---- motions on the agenda for approval requests ---- */
async function addProjectMotions(u, itemId, meetingId) {
  if (!itemId || !meetingId) return;
  for (const pid of (u.project_ids || [])) {
    const p = proj(pid); if (!p || p.approval_status !== 'requested' || !p.approval_ask) continue;
    if (S.motions.some(mo => mo.meeting_id === meetingId && mo.project_id === pid)) continue;
    await save('motions', {id: uid(), meeting_id: meetingId, item_id: itemId, sort: motionsOf(meetingId, itemId).length, text: `Approve: ${p.approval_ask} (${p.title})`, result: 'pending', project_id: pid});
    await save('projects', {...clone(p), approval_status: 'on_agenda', approval_meeting_id: meetingId, updated_at: nowIso()});
  }
}
const _placeUpdate = placeUpdate;

const _createMeeting = createMeeting;

function to24(t) { const m = String(t || '').trim().match(/^(\d{1,2})(?::(\d{2}))?\s*([ap])\.?m?\.?$/i); if (m) { let h = +m[1] % 12; if (/p/i.test(m[3])) h += 12; return pad(h) + ':' + (m[2] || '00'); } return /^\d{1,2}:\d{2}$/.test(String(t || '').trim()) ? String(t).trim().padStart(5, '0') : null; }

/* ---- actions ---- */
Object.assign(ACT, {

  },

/* photo inputs */
document.addEventListener('change', async e => {
